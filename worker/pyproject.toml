[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zmetrics-worker"
version = "0.1.0"
description = "ZMetrics CV/ML analysis worker"
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.3.6",
    "redis>=5.0.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "boto3>=1.34.0",
    "structlog>=24.1.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
]

[project.optional-dependencies]
sam3 = [
    "torch>=2.3.0",
    "transformers>=4.47.0",
    "Pillow>=10.3.0",
    "opencv-python-headless>=4.9.0",
]
cv = [
    "opencv-python-headless>=4.9.0",
    "open3d>=0.18.0",
    "ultralytics>=8.2.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-celery>=1.1.0",
    "aiosqlite>=0.20.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
