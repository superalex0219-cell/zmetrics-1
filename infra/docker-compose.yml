services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [zmetrics]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [zmetrics]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [zmetrics]

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    restart: unless-stopped
    command: start-dev --import-realm
    env_file: .env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KC_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_URL: "http://localhost:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [zmetrics]

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_FRAMES: ${MINIO_BUCKET_FRAMES}
      MINIO_BUCKET_ARTIFACTS: ${MINIO_BUCKET_ARTIFACTS}
      KC_INTERNAL_URL: http://keycloak:8080
      KC_PUBLIC_URL: http://localhost:8080
      KC_REALM: ${KC_REALM}
      KC_CLIENT_ID: ${KC_CLIENT_ID}
      KC_CLIENT_SECRET: ${KC_CLIENT_SECRET:-changeme-replace-in-production}
      # Pydantic-settings field enable_admin_user_management → this exact env name.
      ENABLE_ADMIN_USER_MANAGEMENT: ${ENABLE_ADMIN_USER_MANAGEMENT:-false}
      ENABLE_DEV_SEED: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [zmetrics]

  worker:
    build:
      context: ../worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_FRAMES: ${MINIO_BUCKET_FRAMES}
      MINIO_BUCKET_ARTIFACTS: ${MINIO_BUCKET_ARTIFACTS}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      ENABLE_SAM3: ${ENABLE_SAM3:-false}
      SAM3_MODEL_PATH: ${SAM3_MODEL_PATH:-/models/sam3}
      SAM3_TEXT_PROMPT: ${SAM3_TEXT_PROMPT:-rock fragment}
      SAM3_CONFIDENCE_THRESHOLD: ${SAM3_CONFIDENCE_THRESHOLD:-0.5}
      ENABLE_REAL_STEREO: ${ENABLE_REAL_STEREO:-false}
      DEPTH_BACKEND: ${DEPTH_BACKEND:-sgbm}
      IGEV_CKPT_PATH: ${IGEV_CKPT_PATH:-/models/igev/igev_plusplus/sceneflow.pth}
      IGEV_VALID_ITERS: ${IGEV_VALID_ITERS:-16}
      IGEV_MAX_INFERENCE_WIDTH: ${IGEV_MAX_INFERENCE_WIDTH:-1536}
      ENABLE_LLM_RECOMMENDATIONS: ${ENABLE_LLM_RECOMMENDATIONS:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-6}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-20}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-512}
    volumes:
      - ${SAM3_WEIGHTS_DIR:-../models/sam3}:/models/sam3:ro
      - ${IGEV_WEIGHTS_DIR:-./models/igev}:/models/igev:ro
    command: >
      celery -A app.celery_app worker
      --loglevel=info
      --concurrency=${WORKER_CONCURRENCY:-2}
    # GPU reservation lives in docker-compose.gpu.yml (overlay) — the base stack must
    # start on machines without an NVIDIA GPU (ENABLE_SAM3=false → mock segmentation).
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [zmetrics]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    entrypoint: /bin/sh /init-buckets.sh
    volumes:
      - ./minio/init-buckets.sh:/init-buckets.sh:ro
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_FRAMES: ${MINIO_BUCKET_FRAMES}
      MINIO_BUCKET_ARTIFACTS: ${MINIO_BUCKET_ARTIFACTS}
    networks: [zmetrics]
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  zmetrics:
    driver: bridge
