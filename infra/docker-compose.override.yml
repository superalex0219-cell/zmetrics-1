# Development overrides: hot-reload, exposed ports, debug tools.
# This file is automatically picked up by docker compose when present.

services:
  backend:
    volumes:
      - ../backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

  worker:
    volumes:
      - ../worker:/app
    command: >
      celery -A app.celery_app worker
      --loglevel=debug
      --concurrency=1
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

  # Optional pgAdmin (comment out if not needed)
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@zmetrics.local
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "5050:80"
  #   networks: [zmetrics]
