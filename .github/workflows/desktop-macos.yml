name: Desktop macOS build

# Builds the PySide6 desktop client into a macOS .app + .dmg on a macOS runner.
# PyInstaller cannot cross-compile, so this must run on macos-*, not ubuntu/windows.

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-macos.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-macos.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14  # Apple silicon runner
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app + build deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Run test suite
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build .app + .dmg
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zmetrics-desktop-macos
          path: |
            desktop/dist/ZMetrics.app
            desktop/dist/ZMetrics.dmg
          if-no-files-found: error
          retention-days: 14
