[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zmetrics-desktop"
version = "0.1.0"
description = "ZMetrics desktop client (Windows-first): blast fragmentation stereo capture & analysis"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "keyring>=24",
    "authlib>=1.3",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pygrabber>=0.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.4", "pyinstaller>=6.6"]

[project.scripts]
zmetrics-desktop = "zmetrics_desktop.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["zmetrics_desktop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
